services:
  postgres:
    image: postgres:16-alpine
    container_name: moomin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-moomin}
      POSTGRES_USER: ${DATABASE_USERNAME:-moomin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-moomin}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moomin-app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    ports:
      - '${PORT:-3000}:3000'

volumes:
  postgres_data:
